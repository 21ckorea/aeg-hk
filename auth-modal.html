<!-- Auth modal shell reused by index.html -->
<div class="auth-backdrop" id="auth-backdrop">
  <div class="auth-modal">
    <div class="auth-header">
      <h3>AEG HK 인트라넷 인증</h3>
      <p>Google 로그인 또는 이메일 회원가입으로 바로 시작하세요.</p>
    </div>
    <div class="auth-tabs">
      <button class="auth-tab active" id="tab-login" onclick="switchAuthMode('login')">로그인</button>
      <button class="auth-tab" id="tab-signup" onclick="switchAuthMode('signup')">회원가입</button>
    </div>
    <div class="auth-message" id="auth-message"></div>
    <button class="auth-google-btn" onclick="handleGoogleSignIn()">
      <i data-lucide="chrome"></i> Google 계정으로 계속하기
    </button>
    <form id="login-form" class="auth-form active" onsubmit="handleEmailLogin(event)">
      <input id="login-email" type="email" placeholder="이메일 주소" required>
      <input id="login-password" type="password" placeholder="비밀번호" required>
      <button type="submit">로그인</button>
    </form>
    <form id="signup-form" class="auth-form" onsubmit="handleEmailSignup(event)">
      <input id="signup-name" type="text" placeholder="이름" required>
      <input id="signup-email" type="email" placeholder="이메일 주소" required>
      <input id="signup-password" type="password" placeholder="비밀번호" required>
      <button type="submit">회원가입</button>
    </form>
  </div>
</div>
